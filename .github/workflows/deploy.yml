name: Deploy para GitHub Pages

# Só a main publica. Todo o resto passa antes pelo CI do pull request.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verificar e empacotar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Repetimos as verificações aqui de propósito: nada é publicado sem estar
      # verde, mesmo que alguém envie um commit direto na main.
      - run: npm run lint

      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Precisa bater com o nome do repositório para os assets resolverem
          # na subrota do GitHub Pages.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Impedir o Jekyll de processar o build
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
